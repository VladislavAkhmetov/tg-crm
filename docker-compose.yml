version: '3.8'

services:
  app:
    build: .
    container_name: tg-crm-app
    restart: always
    env_file: .env
    volumes:
      - /opt/tg-crm/crm.db:/app/crm.db
    expose:
      - "8000"
    extra_hosts:
      - "api.telegram.org:149.154.167.220"

  caddy:
    image: caddy:2-alpine
    container_name: tg-crm-caddy
    restart: always
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/tg-crm/surf:/srv/surf:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
